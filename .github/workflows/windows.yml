name: Validate and package Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit public source
        run: |
          python scripts/audit_public_tree.py
          powershell -ExecutionPolicy Bypass -File scripts/audit_public_metadata.ps1
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest==9.0.3
      - name: Run tests
        run: python -m pytest
      - name: Smoke-test desktop startup
        run: python tools/run_avatar_studio.py --smoke-test

  package:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Build Windows distribution
        run: python tools/build_avatar_studio_windows.py
      - name: Smoke-test the packaged application
        run: .\release\AvatarStudio\AvatarStudio-CLI.exe --smoke-test
      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: AvatarStudio-Windows
          path: release/AvatarStudio
